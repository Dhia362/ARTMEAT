<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARTMEAT</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffefb;--card:#fff;--ink:#1c1a2e;--mute:#5d5a6e;--red:#d62828;--gold:#ffc324;--green:#1f7a3d;--line:#e3d3d3;--on-red:#fff;color-scheme:light;
--chk:conic-gradient(#d62828 25%,#fff 0 50%,#d62828 0 75%,#fff 0);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Karla",system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.price,.btn,.cartbtn{font-family:"Bungee","Arial Black",sans-serif;font-weight:400}
h1,h2,h3{margin:0;line-height:1.1}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:var(--red);color:#fff;border-bottom:3px solid var(--ink)}
header h2{font-size:1.5rem;letter-spacing:.06em}
header:after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:var(--chk);background-size:28px 28px;border-bottom:3px solid var(--ink)}
.cartbtn{background:var(--gold);color:var(--ink);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 14px;font-size:.85rem}
main{max-width:1060px;margin:0 auto;padding:44px 22px 80px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;padding:12px 0 34px}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);color:var(--red);text-shadow:3px 3px 0 var(--ink)}
.hero p{margin:20px 0 26px;max-width:32ch;font-size:1.15rem}
.plate{background:var(--chk);background-size:56px 56px;border:3px solid var(--ink);border-radius:18px;box-shadow:8px 8px 0 var(--ink);padding:26px 30px}
.plate svg{display:block;width:100%;height:auto;max-height:340px;margin:auto}
@media(max-width:720px){.hero{grid-template-columns:1fr}.plate{order:-1}}
.sec{display:inline-block;font-size:1.6rem;background:var(--red);color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:8px 22px;margin:22px 0 28px;transform:rotate(-1.5deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:28px}
.item{background:var(--card);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--red);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.item:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 var(--red)}
.pic{background:var(--chk);background-size:40px 40px;border-bottom:3px solid var(--ink);padding:14px 30px}
.pic svg{display:block;width:100%;height:auto;max-height:210px;margin:auto}
.item .body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.item h3{font-size:1.5rem}
.item .d{margin:0}
.item .ing{margin:0;color:var(--mute);font-size:.92rem;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{font-size:1.6rem;color:var(--red)}
.btn{background:var(--red);color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:10px 16px;font-size:.9rem;text-decoration:none;display:inline-block}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.btn.green{background:var(--green)}
.overlay{position:fixed;inset:0;background:rgba(28,26,46,.7);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.open{display:flex}
.sheet{background:#fff;border:3px solid var(--ink);width:100%;max-width:560px;max-height:92%;overflow:auto;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
.sheet>*:not(.pic){margin-left:24px;margin-right:24px}
.sheet>.pic{margin:0 0 18px;padding:12px 60px}
@media(min-width:640px){.overlay{align-items:center}}
.sheet h3{font-size:1.7rem;color:var(--red);margin-bottom:4px}
.sheet h4{margin:22px 24px 6px;font-size:1rem;font-weight:700}
.opt{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);gap:10px}
.opt label{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer}
.opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--red)}
.opt small{color:var(--mute)}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:34px;height:34px;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:50%;font-weight:700}
input[type=text],input[type=tel],textarea,select{width:100%;padding:12px;border:2px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);font:inherit;margin-top:6px}
.cl{border-bottom:1px dashed var(--line);padding:14px 0}
.cl small{display:block;color:var(--mute)}
.total{font-family:"Bungee",sans-serif;font-size:1.6rem;color:var(--red);margin-top:18px;margin-bottom:18px}
.ticket{white-space:pre-wrap;background:#fffbea;border:2px dashed var(--ink);padding:16px;font:14px/1.6 ui-monospace,Menlo,monospace}
.err{color:#b3130f;font-weight:700;margin-top:10px}
.empty{color:var(--mute);padding:18px 0}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
footer{height:40px;background:var(--chk);background-size:40px 40px;border-top:3px solid var(--ink)}
.pic.ph{padding:0;background:none}.pic.ph img{display:block;width:100%;height:230px;object-fit:cover;object-position:center 45%}.sheet>.pic.ph{padding:0;margin:0 0 18px}.plate img{display:block;width:100%;height:auto;border:3px solid var(--ink);border-radius:8px}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--red);padding:10px 14px;font-family:"Bungee",sans-serif;font-weight:400}.bar[hidden]{display:none}.bar .btn{background:var(--gold);color:var(--ink)}
header{flex-wrap:wrap;gap:10px}header nav{display:flex;gap:8px}
.tab{background:#fff;color:var(--ink);border:3px solid var(--ink);padding:7px 12px;font-family:"Bungee",sans-serif;font-size:.8rem;cursor:pointer}.tab.on{background:var(--gold)}
.otop{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.otop input{padding:8px;border:2px solid var(--ink);border-radius:6px;font:inherit}
.chip{background:var(--gold);border:2px solid var(--ink);padding:2px 10px;font-weight:700;font-size:.85rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin:22px 0}
.card{border:3px solid var(--ink);box-shadow:5px 5px 0 var(--red);padding:14px;background:#fff}.card .big{font-family:"Bungee",sans-serif;font-size:1.8rem;color:var(--red)}.card small{color:var(--mute);display:block}
#viewOrd h2{font-size:1.2rem;margin:26px 0 10px}#viewOrd table{width:100%;border-collapse:collapse}#viewOrd td,#viewOrd th{text-align:left;padding:8px 6px;border-bottom:1px dashed var(--line)}#viewOrd td:last-child,#viewOrd th:last-child{text-align:right}tr.pk{cursor:pointer}
details.ord{border:3px solid var(--ink);margin:12px 0;background:#fff}details.ord summary{cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;font-weight:700}
details.ord pre{margin:0;padding:12px 14px;white-space:pre-wrap;background:#fffbea;border-top:2px dashed var(--ink);font:14px/1.6 ui-monospace,Menlo,monospace}details.ord .acts{padding:0 14px 14px;margin-top:0}
.badge{padding:2px 8px;margin-right:8px;border:2px solid var(--ink);font-size:.8rem}.badge.new{background:var(--gold)}.badge.ready{background:#b7e4c0}.badge.done{background:#e6e6ee}
@media print{header,.bar,footer,.noprint,#viewNew{display:none!important}}
</style>
</head>
<body>
<header><h2 id="shop">ARTMEAT</h2><nav><button class="tab on" id="tabNew">New order</button><button class="tab" id="tabOrd">Orders <span id="ocnt">0</span></button></nav><button class="cartbtn" id="cartBtn">Your order (<span id="cnt">0</span>)</button></header>
<main><div id="viewNew">
<section class="hero"><div><h1>Take an order.</h1><p>Tap a burger, take off what the customer doesn't want, add their extras. Add as many burgers as they ask for, then save the order.</p><a class="btn" href="#menu-t">Order now</a></div><div class="plate" id="heroArt"></div></section>
<h2 class="sec" id="menu-t">The menu</h2>
<section class="grid" id="menu"></section>
</div><div id="viewOrd" hidden></div></main>
<footer></footer>
<div class="bar" id="bar" hidden><b id="barTxt"></b><button class="btn" id="barBtn">View order</button></div>
<div class="overlay" id="ov"><div class="sheet" id="sheet"></div></div>

 cur={b:b,off:f?f.off.slice():b.ing.map(function(){return false}),extras:f?f.extras.slice():EXTRAS.map(function(){return 0}),qty:1,note:f?f.note:""};

 b.ing.forEach(function(n,i){h+='<div class="opt"><label><input type="checkbox" '+(cur.off[i]?'':'checked')+' data-i="'+i+'"> '+n+'</label></div>'});
 h+='<h4>Add extras</h4>';
 EXTRAS.forEach(function(x,i){h+='<div class="opt"><span>'+x[0]+' <small>+'+money(x[1])+'</small></span><span class="qty"><button data-m="'+i+'" aria-label="Less '+x[0]+'">−</button><span id="x'+i+'">'+cur.extras[i]+'</span><button data-p="'+i+'" aria-label="More '+x[0]+'">+</button></span></div>'});
 h+='<h4>Notes for the kitchen</h4><textarea id="note" rows="2" placeholder="e.g. well done, sauce on the side">'+esc(cur.note)+'</textarea>';
 h+='<div class="row" style="margin-top:18px"><span class="qty"><b>How many?</b><button id="qm" aria-label="Fewer burgers">−</button><b id="q">1</b><button id="qp" aria-label="More burgers">+</button></span><button class="btn" id="add">Add to order</button></div><p style="margin:10px 24px 0;color:var(--mute);font-size:.9rem">Same ingredients for every one you add here. Want them different? Add this one, then add another.</p><div class="acts"><button class="btn alt" id="cx">Cancel</button></div>';

  if(t.getAttribute("data-m")!==null){var j=+t.getAttribute("data-m");if(cur.extras[j]>0)cur.extras[j]--;$("x"+j).textContent=cur.extras[j]}

 var removed=l.b.ing.filter(function(n,i){return l.off[i]}),ex=[];

function lsLoad(){try{DAYS=JSON.parse(localStorage.getItem("artmeat_days")||"{}")||{}}catch(e){DAYS={}}}
function persist(day){
 var arr=DAYS[day]||[];
 if(!MODE){try{localStorage.setItem("artmeat_days",JSON.stringify(DAYS));return Promise.resolve(true)}catch(e){return Promise.resolve(false)}}
 Q=Q.then(function(){return MODE.doc("days/"+day).set({orders:JSON.parse(JSON.stringify(arr))})}).then(function(){return true},function(){return false});
 return Q;
}
function tk(o){
 var t=SHOP_NAME+" - ORDER #"+o.no+"\n"+dayKey(o.t)+" "+tm(o.t)+"\n\n";
 o.items.forEach(function(i,n){t+=(n+1)+") "+i.q+" x "+i.n+(i.q>1?" (all "+i.q+" identical)":"")+" - "+money(i.p)+"\n";i.ing.forEach(function(g){t+="   "+(g.no?"[NO] ":"[ok] ")+g.g+"\n"});i.ex.forEach(function(x){t+="   [ADD] "+(x.q>1?x.q+"x ":"")+x.n+"\n"});if(i.note)t+="   NOTE: "+i.note+"\n";t+="\n"});
 if(o.fee)t+="Delivery: "+money(o.fee)+"\n";
 return t+"TOTAL: "+money(o.total)+"\n\n"+(o.name?"Name: "+o.name+"\n":"")+(o.phone?"Phone: "+o.phone+"\n":"")+(o.kind==="Delivery"?"Delivery to: "+o.addr:"Pick up");
}
function ticket(nm,ph,ty,ad){
 var fee=ty==="delivery"?DELIVERY_FEE:0,day=dayKey(),n=(DAYS[day]||[]).length+1;
 var o={id:Date.now().toString(36),no:n,t:new Date().toISOString(),name:nm,phone:ph,kind:ty==="delivery"?"Delivery":"Pick up",addr:ad,fee:fee,total:subtotal()+fee,st:"new",
  items:cart.map(function(l){return{n:l.b.name,q:l.qty,p:lineTotal(l),note:l.note,ing:l.b.ing.map(function(g,i){return{g:g,no:!!l.off[i]}}),ex:l.extras.map(function(q,i){return q?{n:EXTRAS[i][0],q:q}:null}).filter(Boolean)}})};
 DAYS[day]=(DAYS[day]||[]).concat([o]);
 persist(day).then(function(ok){
  if(ok){cart=[];upd()}else{DAYS[day]=DAYS[day].filter(function(x){return x.id!==o.id})}
  open('<h3>'+(ok?'Order #'+n+' saved':'Order not saved')+'</h3>'+(ok?'':'<p class="err">This order could not be saved. Copy the ticket and try again.</p>')+'<div class="ticket">'+esc(tk(o))+'</div><div class="acts"><button class="btn" id="cp">Copy ticket</button><button class="btn green" id="nw">'+(ok?'Start a new order':'Close')+'</button></div><div class="err" id="er" style="color:var(--green)"></div>');
  $("cp").onclick=function(){try{navigator.clipboard.writeText(tk(o)).then(function(){$("er").textContent="Copied."},function(){$("er").textContent="Select the text above and copy it."})}catch(x){$("er").textContent="Select the text above and copy it."}};
  $("nw").onclick=function(){close();refresh()};
  refresh();
 });
}
function refresh(){$("ocnt").textContent=(DAYS[dayKey()]||[]).length;if(!$("viewOrd").hidden)renderOrd()}
function show(v){$("viewNew").hidden=v!=="new";$("viewOrd").hidden=v!=="ord";$("bar").style.display=v==="new"?"":"none";$("tabNew").className="tab"+(v==="new"?" on":"");$("tabOrd").className="tab"+(v==="ord"?" on":"");if(v==="ord")renderOrd();else window.scrollTo(0,0)}
function card(a,b,c){var d=el("div","card");d.appendChild(el("small","",a));d.appendChild(el("div","big",b));d.appendChild(el("small","",c));return d}
function renderOrd(){
 var v=$("viewOrd"),day=VIEWDAY||dayKey(),all=DAYS[day]||[],list=all.slice().reverse();v.textContent="";
 var top=el("div","otop noprint"),lab=el("label","","Day "),di=document.createElement("input");di.type="date";di.value=day;di.onchange=function(){VIEWDAY=di.value||"";renderOrd()};lab.appendChild(di);top.appendChild(lab);var st=el("span","chip");st.id="stt";top.appendChild(st);v.appendChild(top);stat();
 var sum=0,bg=0,by={};all.forEach(function(o){sum+=o.total;o.items.forEach(function(i){bg+=i.q;by[i.n]=by[i.n]||{q:0,p:0};by[i.n].q+=i.q;by[i.n].p+=i.p})});
 v.appendChild(el("h2","",day===dayKey()?"Today":day));
 var cs=el("div","cards");cs.appendChild(card("Money made",money(sum),"all orders"));cs.appendChild(card("Orders",String(all.length),"customers"));cs.appendChild(card("Burgers sold",String(bg),"in total"));v.appendChild(cs);
 var ks=Object.keys(by);
 if(ks.length){var tb=el("table"),hr=el("tr");["Burger","Sold","Sales"].forEach(function(x){hr.appendChild(el("th","",x))});tb.appendChild(hr);ks.forEach(function(k){var r=el("tr");r.appendChild(el("td","",k));r.appendChild(el("td","",String(by[k].q)));r.appendChild(el("td","",money(by[k].p)));tb.appendChild(r)});v.appendChild(tb)}
 var pa=el("div","acts noprint"),pb=el("button","btn","Print report");pb.onclick=function(){window.print()};pa.appendChild(pb);
 var cb=el("button","btn alt","Copy summary");cb.onclick=function(){var t=SHOP_NAME+" - "+day+"\nOrders: "+all.length+"\nBurgers sold: "+bg+"\nMoney made: "+money(sum);ks.forEach(function(k){t+="\n"+k+": "+by[k].q});try{navigator.clipboard.writeText(t).then(function(){cb.textContent="Copied"},function(){cb.textContent="Copy failed"})}catch(x){cb.textContent="Copy failed"}};pa.appendChild(cb);v.appendChild(pa);
 v.appendChild(el("h2","",list.length?"Orders (newest first)":"No orders on this day yet"));
 list.forEach(function(o){
  var d=document.createElement("details");d.className="ord";if(o.st!=="done")d.open=true;
  var sm=document.createElement("summary"),rt=el("span");sm.appendChild(el("span","","#"+o.no+" "+tm(o.t)+" "+(o.name||"Customer")+" ("+o.kind+")"));rt.appendChild(el("span","badge "+o.st,LBL[o.st]));rt.appendChild(el("b","",money(o.total)));sm.appendChild(rt);d.appendChild(sm);d.appendChild(el("pre","",tk(o)));
  var ac=el("div","acts noprint"),nx=el("button","btn",o.st==="new"?"Mark ready":o.st==="ready"?"Mark done":"Reopen");
  nx.onclick=function(){o.st=o.st==="new"?"ready":o.st==="ready"?"done":"new";persist(day).then(renderOrd)};ac.appendChild(nx);
  var dl=el("button","btn alt","Delete"),arm=false;dl.onclick=function(){if(!arm){arm=true;dl.textContent="Tap again to delete";return}DAYS[day]=DAYS[day].filter(function(x){return x.id!==o.id});persist(day).then(function(){refresh();renderOrd()})};ac.appendChild(dl);
  d.appendChild(ac);v.appendChild(d)});
 var ds=Object.keys(DAYS).filter(function(k){return DAYS[k].length}).sort().reverse().slice(0,14);
 if(ds.length){v.appendChild(el("h2","noprint","Recent days"));var t2=el("table","noprint"),h2=el("tr");["Day","Orders","Money made"].forEach(function(x){h2.appendChild(el("th","",x))});t2.appendChild(h2);
  ds.forEach(function(k){var r=el("tr","pk"),m=0;DAYS[k].forEach(function(o){m+=o.total});r.appendChild(el("td","",k));r.appendChild(el("td","",String(DAYS[k].length)));r.appendChild(el("td","",money(m)));r.onclick=function(){VIEWDAY=k;renderOrd();window.scrollTo(0,0)};t2.appendChild(r)});v.appendChild(t2)}
}
$("tabNew").onclick=function(){show("new")};$("tabOrd").onclick=function(){VIEWDAY="";show("ord")};
lsLoad();refresh();
if(FIREBASE_READY){
  MODE={
    doc:function(path){return window.artmeatDb.doc(path)},
    collection:function(name){return window.artmeatDb.collection(name)}
  };
  MODE.collection("days").onSnapshot(function(sn){
    var d={};
    sn.docs.forEach(function(x){var b=x.data();d[x.id]=JSON.parse(JSON.stringify((b&&b.orders)||[]))});
    DAYS=d;stat();refresh();
  },function(err){
    console.error("Firestore error",err);
    MODE=null;lsLoad();stat();refresh();
  });
}
</script>
</body>
</html>
